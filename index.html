<!DOCTYPE html>
<html lang="en)
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Notes Studio - Studio Engine</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #121b2e;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #1e293b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
        }

        .studio-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #38bdf8;
            font-size: 26px;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.tagline {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .control-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: var(--bg-main);
            border-radius: 10px;
            border: 2px dashed #334155;
            color: var(--text-secondary);
            box-sizing: border-box;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: var(--accent);
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 35px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            border: 1px solid #334155;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #334155;
            cursor: not-allowed;
            color: var(--text-secondary);
        }

        #status-display {
            margin-top: 30px;
            font-size: 14px;
            color: #38bdf8;
            font-weight: 500;
            text-align: center;
            min-height: 24px;
            background: rgba(56, 189, 248, 0.08);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            line-height: 1.6;
        }

        /* Premium Attribution Styling */
        .studio-footer-credit {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .studio-footer-credit span {
            color: #38bdf8;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

<div class="studio-card">
    <h2>Canvas Notes Studio</h2>
    <p class="tagline">Anti-Aliasing Preservation Mapping Engine & Sequential Multi-File Pipeline</p>
    
    <div class="control-group">
        <label for="pdf-files">Select Master PDF Files (Supports 10+ Files Easily)</label>
        <input type="file" id="pdf-files" accept="application/pdf" multiple>
    </div>

    <div class="layout-grid">
        <div class="control-group">
            <label for="columns-count">Columns Allocation</label>
            <select id="columns-count">
                <option value="1">1 Column</option>
                <option value="2" selected>2 Columns</option>
                <option value="3">3 Columns</option>
            </select>
        </div>
        <div class="control-group">
            <label for="rows-count">Rows Grid Allocation</label>
            <select id="rows-count">
                <option value="1">1 Row</option>
                <option value="2" selected>2 Rows (Standard 4-Grid)</option>
                <option value="3">3 Rows (6-Grid)</option>
                <option value="4">4 Rows</option>
                <option value="5">5 Rows</option>
                <option value="6">6 Rows</option>
                <option value="7">7 Rows</option>
                <option value="8">8 Rows</option>
                <option value="9">9 Rows</option>
                <option value="10">10 Rows (Maximum Density)</option>
            </select>
        </div>
    </div>
    
    <button id="engine-start-btn" disabled>Execute High-Quality Conversion</button>
    
    <div id="status-display">System ready. Upload slide documents to begin process sequence...</div>

    <div class="studio-footer-credit">
        Engine Engineered & Crafted By <span>Harsh Ranjan</span>
    </div>
</div>

<canvas id="render-pipeline-canvas" style="display:none;"></canvas>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('pdf-files');
    const colsSelect = document.getElementById('columns-count');
    const rowsSelect = document.getElementById('rows-count');
    const processBtn = document.getElementById('engine-start-btn');
    const statusBox = document.getElementById('status-display');
    const canvas = document.getElementById('render-pipeline-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    fileInput.addEventListener('change', (e) => {
        const fileCount = e.target.files.length;
        if (fileCount > 0) {
            processBtn.disabled = false;
            statusBox.innerText = `${fileCount} documents verified and queued. Ready to execute pipeline.`;
        }
    });

    processBtn.addEventListener('click', async () => {
        const files = fileInput.files;
        if (files.length === 0) return;

        const cols = parseInt(colsSelect.value);
        const rows = parseInt(rowsSelect.value);
        const slidesPerPage = cols * rows;

        processBtn.disabled = true;

        try {
            const { jsPDF } = window.jspdf;
            const targetPdf = new jsPDF('p', 'mm', 'a4');
            const a4W = targetPdf.internal.pageSize.getWidth();
            const a4H = targetPdf.internal.pageSize.getHeight();

            const borderMarginX = 8;
            const borderMarginY = 8;
            const intraGridGap = 3;

            const usableGridW = a4W - (2 * borderMarginX) - ((cols - 1) * intraGridGap);
            const slotW = usableGridW / cols;
            const usableGridH = a4H - (2 * borderMarginY) - ((rows - 1) * intraGridGap);
            const slotH = usableGridH / rows;

            let currentSlotIndex = 0;
            let totalProcessedSlides = 0;

            for (let fIdx = 0; fIdx < files.length; fIdx++) {
                const currentFile = files[fIdx];
                const fileBuffer = await currentFile.arrayBuffer();
                
                const documentSource = await pdfjsLib.getDocument({ data: fileBuffer }).promise;
                const totalSlides = documentSource.numPages;

                for (let currentSlide = 1; currentSlide <= totalSlides; currentSlide++) {
                    statusBox.innerHTML = `<strong>[File ${fIdx + 1}/${files.length}]</strong><br>Restoring and Mapping Slide ${currentSlide}/${totalSlides}...`;

                    const page = await documentSource.getPage(currentSlide);
                    const viewport = page.getViewport({ scale: 2.5 }); 
                    canvas.width = viewport.width;
                    canvas.height = viewport.height;

                    await page.render({ canvasContext: ctx, viewport: viewport }).promise;

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const pixelBuffer = imgData.data;

                    for (let index = 0; index < pixelBuffer.length; index += 4) {
                        let r = pixelBuffer[index];
                        let g = pixelBuffer[index+1];
                        let b = pixelBuffer[index+2];

                        let invR = 255 - r;
                        let invG = 255 - g;
                        let invB = 255 - b;

                        let invBrightness = 0.299 * invR + 0.587 * invG + 0.114 * invB;
                        let colorSpread = Math.max(invR, invG, invB) - Math.min(invR, invG, invB);

                        if (invBrightness > 155 && colorSpread < 40) {
                            pixelBuffer[index]   = 255;
                            pixelBuffer[index+1] = 255;
                            pixelBuffer[index+2] = 255;
                        } else if (colorSpread < 40) {
                            let intensity = invBrightness / 155; 
                            let darkValue = Math.floor(12 * intensity); 
                            pixelBuffer[index]   = darkValue;
                            pixelBuffer[index+1] = darkValue;
                            pixelBuffer[index+2] = darkValue;
                        } else {
                            pixelBuffer[index]   = invR;
                            pixelBuffer[index+1] = invG;
                            pixelBuffer[index+2] = invB;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);

                    const slideStreamAsset = canvas.toDataURL('image/jpeg', 0.85);

                    if (totalProcessedSlides > 0 && currentSlotIndex === 0) {
                        targetPdf.addPage();
                    }

                    const cellColumnIndex = currentSlotIndex % cols;
                    const cellRowIndex = Math.floor(currentSlotIndex / cols);

                    const dynamicX = borderMarginX + (cellColumnIndex * (slotW + intraGridGap));
                    const dynamicY = borderMarginY + (cellRowIndex * (slotH + intraGridGap));

                    const slideAspect = viewport.width / viewport.height;
                    let targetDrawW = slotW;
                    let targetDrawH = slotW / slideAspect;

                    if (targetDrawH > slotH) {
                        targetDrawH = slotH;
                        targetDrawW = slotH * slideAspect;
                    }

                    const finalPositionX = dynamicX + (slotW - targetDrawW) / 2;
                    const finalPositionY = dynamicY + (slotH - targetDrawH) / 2;

                    targetPdf.addImage(slideStreamAsset, 'JPEG', finalPositionX, finalPositionY, targetDrawW, targetDrawH);
                    
                    currentSlotIndex = (currentSlotIndex + 1) % slidesPerPage;
                    totalProcessedSlides++;
                }
                
                await documentSource.destroy();
            }

            statusBox.innerText = "Assembling master printable data matrix...";
            targetPdf.save('notes-crafter-premium-grid.pdf');
            statusBox.innerText = `Process Sequence successful. Processed all ${files.length} documents into premium notes layout!`;

        } catch (err) {
            console.error(err);
            statusBox.innerText = "Processing exception occurred. Reset pipeline execution parameters.";
        } finally {
            processBtn.disabled = false;
        }
    });
</script>

</body>
</html>
