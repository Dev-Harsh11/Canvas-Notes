<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Notes Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-main: #090d16;
            --bg-card: #121b2e;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #1e293b;
            --purple-glow: #8b5cf6;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            max-width: 680px;
            margin: 40px auto;
            padding: 20px;
        }

        .studio-card {
            background: var(--bg-card);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
        }

        h2 {
            text-align: center;
            margin-top: 0;
            color: #38bdf8;
            font-size: 26px;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        p.tagline {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 35px;
            line-height: 1.4;
        }

        .control-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: var(--bg-main);
            border-radius: 10px;
            border: 2px dashed #334155;
            color: var(--text-secondary);
            box-sizing: border-box;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: var(--accent);
        }

        .file-workspace {
            background: rgba(4, 7, 13, 0.5);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
        }

        .workspace-title {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 12px;
            padding-bottom: 6px;
            border-bottom: 1px solid #1e293b;
        }

        .file-order-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-sort-item {
            display: flex;
            align-items: center;
            background: var(--bg-main);
            border: 1px solid #334155;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: grab;
            user-select: none;
        }

        .file-sort-item.dragging {
            opacity: 0.4;
            border-color: var(--accent);
        }

        .grid-workspace-wrapper {
            background: rgba(4, 7, 13, 0.6);
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .grid-workspace-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 18px;
        }

        .selection-count-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .toggle-btn-group {
            display: flex;
            gap: 10px;
        }

        .utility-btn {
            background: #1e293b;
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 6px;
            border: 1px solid #334155;
            cursor: pointer;
        }

        .utility-btn:hover {
            background: #334155;
            color: white;
        }

        .pages-drag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(135px, 1fr));
            gap: 14px;
            max-height: 400px;
            overflow-y: auto;
            padding: 4px;
        }

        .page-preview-card {
            background: var(--bg-card);
            border: 2px solid #1e293b;
            border-radius: 10px;
            padding: 8px;
            position: relative;
            cursor: grab;
            user-select: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .page-preview-card.selected-active {
            border-color: var(--purple-glow);
            box-shadow: 0 0 12px rgba(139, 92, 246, 0.25);
        }

        .page-preview-card.dragging {
            opacity: 0.4;
            border: 2px dashed var(--purple-glow);
        }

        .page-preview-card canvas {
            width: 100%;
            height: auto;
            background: #000;
            border-radius: 6px;
            display: block;
            margin-bottom: 8px;
            pointer-events: none;
        }

        .card-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 4px;
        }

        .card-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--purple-glow);
            cursor: pointer;
        }

        .card-index-badge {
            font-size: 11px;
            font-weight: 700;
            background: var(--purple-glow);
            color: white;
            padding: 3px 8px;
            border-radius: 20px;
            min-width: 12px;
            text-align: center;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 22px;
        }

        select {
            width: 100%;
            padding: 12px;
            background: var(--bg-main);
            border: 1px solid #334155;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }

        button.main-exec-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            transition: background 0.2s;
            margin-top: 15px;
        }

        button.main-exec-btn:hover {
            background-color: var(--accent-hover);
        }

        button.main-exec-btn:disabled {
            background-color: #334155;
            cursor: not-allowed;
            color: var(--text-secondary);
        }

        #status-display {
            margin-top: 30px;
            font-size: 14px;
            color: #38bdf8;
            font-weight: 500;
            text-align: center;
            min-height: 24px;
            background: rgba(56, 189, 248, 0.08);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            line-height: 1.6;
        }

        .pages-drag-grid::-webkit-scrollbar { width: 6px; }
        .pages-drag-grid::-webkit-scrollbar-track { background: transparent; }
        .pages-drag-grid::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .studio-footer-credit {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .studio-footer-credit span {
            color: #38bdf8;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <h2>Canvas Notes Studio</h2>
    <p class="tagline">Custom Grid Generator & Multi-File Sequence Matrix</p>
    
    <div class="control-group">
        <label for="pdf-files">Select Master PDF Files</label>
        <input type="file" id="pdf-files" accept="application/pdf" multiple>
    </div>

    <div id="file-workspace-block" class="file-workspace" style="display: none;">
        <span class="workspace-title">Step 1: Drag & Arrange Files to Set Sequence Matrix:</span>
        <div id="file-order-list-container" class="file-order-list"></div>
        <button id="generate-cards-btn" class="utility-btn" style="margin-top: 12px; background: var(--accent); color: white; border: none; width: 100%; padding: 10px;" type="button">Generate Drag & Drop Cards</button>
    </div>

    <div id="grid-workspace-block" class="grid-workspace-wrapper" style="display: none;">
        <div class="grid-workspace-header">
            <div id="selection-counter" class="selection-count-text">0 of 0 pages selected</div>
            <div class="toggle-btn-group">
                <button id="select-all-btn" class="utility-btn" type="button">Select All</button>
                <button id="deselect-all-btn" class="utility-btn" type="button">Deselect All</button>
            </div>
        </div>
        <div id="pages-container-grid" class="pages-drag-grid"></div>
    </div>

    <div class="layout-grid">
        <div class="control-group">
            <label for="orientation-mode">Page Orientation</label>
            <select id="orientation-mode">
                <option value="p" selected>Portrait (Vertical A4)</option>
                <option value="l">Landscape (Horizontal A4)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="columns-count">Columns Allocation</label>
            <select id="columns-count">
                <option value="1">1 Column</option>
                <option value="2" selected>2 Columns (Recommended)</option>
                <option value="3">3 Columns</option>
            </select>
        </div>
    </div>

    <div class="layout-grid">
        <div class="control-group">
            <label for="rows-count">Rows Grid Allocation</label>
            <select id="rows-count">
                <option value="1">1 Row</option>
                <option value="2" selected>2 Rows (Best Clarity)</option>
                <option value="3">3 Rows</option>
                <option value="4">4 Rows</option>
                <option value="5">5 Rows</option>
            </select>
        </div>

        <div class="control-group">
            <label for="output-mode">Output Visual Mode</label>
            <select id="output-mode">
                <option value="color" selected>Vibrant Original Color</option>
                <option value="bw">Grayscale Mode</option>
            </select>
        </div>
    </div>

    <div class="control-group">
        <label for="invert-mode">Inversion Strategy</label>
        <select id="invert-mode">
            <option value="auto" selected>Auto Invert (Dark Slides to White)</option>
            <option value="always">Always Invert</option>
            <option value="never">Never Invert (Keep Original Colors)</option>
        </select>
    </div>
    
    <button id="engine-start-btn" class="main-exec-btn" disabled>Execute High-Quality Conversion</button>
    <div id="status-display">System ready. Upload slide documents to begin...</div>

    <div class="studio-footer-credit">
        Engine Engineered & Crafted By <span>Harsh Ranjan</span>
    </div>
</div>

<canvas id="render-pipeline-canvas" style="display:none;"></canvas>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('pdf-files');
    const orientationSelect = document.getElementById('orientation-mode');
    const colsSelect = document.getElementById('columns-count');
    const rowsSelect = document.getElementById('rows-count');
    const modeSelect = document.getElementById('output-mode');
    const invertSelect = document.getElementById('invert-mode');
    const processBtn = document.getElementById('engine-start-btn');
    const statusBox = document.getElementById('status-display');
    const canvas = document.getElementById('render-pipeline-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    const fileWorkspaceBlock = document.getElementById('file-workspace-block');
    const fileOrderListContainer = document.getElementById('file-order-list-container');
    const generateCardsBtn = document.getElementById('generate-cards-btn');
    const gridWorkspaceBlock = document.getElementById('grid-workspace-block');
    const pagesContainerGrid = document.getElementById('pages-container-grid');
    const selectionCounter = document.getElementById('selection-counter');
    const selectAllBtn = document.getElementById('select-all-btn');
    const deselectAllBtn = document.getElementById('deselect-all-btn');

    let MemoryFileArrayObjects = [];
    let DynamicCardsArrayTrack = [];

    fileInput.addEventListener('change', (e) => {
        const files = e.target.files;
        if (files.length === 0) return;

        MemoryFileArrayObjects = [];
        fileOrderListContainer.innerHTML = '';
        pagesContainerGrid.innerHTML = '';
        gridWorkspaceBlock.style.display = 'none';

        for (let i = 0; i < files.length; i++) {
            MemoryFileArrayObjects.push({
                uid: 'file_' + i + '_' + Date.now(),
                fileDataRef: files[i]
            });
        }

        MemoryFileArrayObjects.forEach(item => {
            const fileRow = document.createElement('div');
            fileRow.className = 'file-sort-item';
            fileRow.setAttribute('draggable', 'true');
            fileRow.setAttribute('data-file-uid', item.uid);
            fileRow.innerHTML = `<span style="margin-right:12px; color:#475569;">☰</span><span style="font-size:13px;">${item.fileDataRef.name}</span>`;
            fileOrderListContainer.appendChild(fileRow);

            fileRow.addEventListener('dragstart', () => fileRow.classList.add('dragging'));
            fileRow.addEventListener('dragend', () => fileRow.classList.remove('dragging'));
        });

        initFileDragAndDropEngine();
        fileWorkspaceBlock.style.display = 'block';
        statusBox.innerText = "Files mapped. Arrange sequence above then click 'Generate Drag & Drop Cards'.";
    });

    generateCardsBtn.addEventListener('click', async () => {
        statusBox.innerText = "Processing PDF documents in parallel...";
        pagesContainerGrid.innerHTML = '';
        DynamicCardsArrayTrack = [];
        generateCardsBtn.disabled = true;

        const currentFileDomSequence = [...fileOrderListContainer.querySelectorAll('.file-sort-item')];
        
        try {
            const documentLoadingPromises = currentFileDomSequence.map(async (row, indexRank) => {
                const uid = row.getAttribute('data-file-uid');
                const targetFileObj = MemoryFileArrayObjects.find(f => f.uid === uid);
                const buffer = await targetFileObj.fileDataRef.arrayBuffer();
                const docRef = await pdfjsLib.getDocument({ data: buffer }).promise;
                return { fileIndex: indexRank, docRef: docRef };
            });

            const loadedChunks = await Promise.all(documentLoadingPromises);
            loadedChunks.sort((alpha, beta) => alpha.fileIndex - beta.fileIndex);

            let runningGlobalCardId = 1;

            for (const chunk of loadedChunks) {
                const docRef = chunk.docRef;
                const pagePromises = [];

                for (let pNum = 1; pNum <= docRef.numPages; pNum++) {
                    pagePromises.push(docRef.getPage(pNum));
                }

                const pageInstances = await Promise.all(pagePromises);

                for (const pageInstance of pageInstances) {
                    const cardMeta = {
                        internalCardId: 'card_' + runningGlobalCardId + '_' + Date.now(),
                        pageRef: pageInstance,
                        isSelected: true
                    };
                    DynamicCardsArrayTrack.push(cardMeta);

                    const pageCard = document.createElement('div');
                    pageCard.className = 'page-preview-card selected-active';
                    pageCard.setAttribute('draggable', 'true');
                    pageCard.setAttribute('data-internal-card-id', cardMeta.internalCardId);

                    const thumbCanvas = document.createElement('canvas');
                    const thumbCtx = thumbCanvas.getContext('2d', { alpha: false });
                    
                    const viewport = pageInstance.getViewport({ scale: 0.15 });
                    thumbCanvas.width = viewport.width;
                    thumbCanvas.height = viewport.height;

                    const rowControls = document.createElement('div');
                    rowControls.className = 'card-controls-row';
                    rowControls.innerHTML = `
                        <input type="checkbox" checked class="card-checkbox">
                        <span class="card-index-badge">${runningGlobalCardId}</span>
                    `;

                    pageCard.appendChild(thumbCanvas);
                    pageCard.appendChild(rowControls);
                    pagesContainerGrid.appendChild(pageCard);

                    pageInstance.render({ canvasContext: thumbCtx, viewport: viewport });

                    const cb = rowControls.querySelector('.card-checkbox');
                    cb.addEventListener('change', (evt) => {
                        cardMeta.isSelected = evt.target.checked;
                        if (evt.target.checked) {
                            pageCard.classList.add('selected-active');
                        } else {
                            pageCard.classList.remove('selected-active');
                        }
                        updateSelectionCounter();
                    });

                    pageCard.addEventListener('dragstart', () => pageCard.classList.add('dragging'));
                    pageCard.addEventListener('dragend', () => pageCard.classList.remove('dragging'));

                    runningGlobalCardId++;
                }
            }

            initCardsDragAndDropEngine();
            updateSelectionCounter();
            gridWorkspaceBlock.style.display = 'block';
            processBtn.disabled = false;
            statusBox.innerText = "Workspace loaded! Drag cards to reorder as needed.";

        } catch (error) {
            console.error(error);
            statusBox.innerText = "Error loading PDF files.";
        } finally {
            generateCardsBtn.disabled = false;
        }
    });

    function initFileDragAndDropEngine() {
        fileOrderListContainer.addEventListener('dragover', (e) => {
            e.preventDefault();
            const draggingFile = document.querySelector('.file-sort-item.dragging');
            if (!draggingFile) return;

            const remainingRows = [...fileOrderListContainer.querySelectorAll('.file-sort-item:not(.dragging)')];
            const nextRow = remainingRows.find(row => {
                const box = row.getBoundingClientRect();
                return (e.clientY - box.top - box.height / 2 < 0);
            });

            if (nextRow == null) {
                fileOrderListContainer.appendChild(draggingFile);
            } else {
                fileOrderListContainer.insertBefore(draggingFile, nextRow);
            }
        });
    }

    function initCardsDragAndDropEngine() {
        pagesContainerGrid.addEventListener('dragover', (e) => {
            e.preventDefault();
            const draggingCard = document.querySelector('.page-preview-card.dragging');
            if (!draggingCard) return;

            const targetRemainingCards = [...pagesContainerGrid.querySelectorAll('.page-preview-card:not(.dragging)')];
            const nextSiblingCard = targetRemainingCards.find(card => {
                const box = card.getBoundingClientRect();
                const offsetX = e.clientX - box.left - box.width / 2;
                return (offsetX < 0 && (e.clientY - box.top - box.height / 2) < 0);
            });

            if (nextSiblingCard == null) {
                pagesContainerGrid.appendChild(draggingCard);
            } else {
                pagesContainerGrid.insertBefore(draggingCard, nextSiblingCard);
            }
        });
    }

    selectAllBtn.addEventListener('click', () => toggleAllGlobalPageCardsState(true));
    deselectAllBtn.addEventListener('click', () => toggleAllGlobalPageCardsState(false));

    function toggleAllGlobalPageCardsState(statusValue) {
        DynamicCardsArrayTrack.forEach(item => item.isSelected = statusValue);
        const cards = pagesContainerGrid.querySelectorAll('.page-preview-card');
        cards.forEach(card => {
            const cb = card.querySelector('.card-checkbox');
            if (cb) cb.checked = statusValue;
            if (statusValue) {
                card.classList.add('selected-active');
            } else {
                card.classList.remove('selected-active');
            }
        });
        updateSelectionCounter();
    }

    function updateSelectionCounter() {
        const total = DynamicCardsArrayTrack.length;
        const selected = DynamicCardsArrayTrack.filter(p => p.isSelected).length;
        selectionCounter.innerText = `${selected} of ${total} pages selected`;
    }

    processBtn.addEventListener('click', async () => {
        const startTime = performance.now();
        const visualDomCardsOrder = [...pagesContainerGrid.querySelectorAll('.page-preview-card')];
        let finalExecutionPipeline = [];

        visualDomCardsOrder.forEach(card => {
            const cId = card.getAttribute('data-internal-card-id');
            const matchObj = DynamicCardsArrayTrack.find(item => item.internalCardId === cId);
            if (matchObj && matchObj.isSelected) {
                finalExecutionPipeline.push(matchObj);
            }
        });

        if (finalExecutionPipeline.length === 0) {
            statusBox.innerText = "Process Aborted: No pages selected.";
            return;
        }

        processBtn.disabled = true;
        const chosenOrientation = orientationSelect.value;
        const chosenMode = modeSelect.value;
        const chosenInvert = invertSelect.value;

        try {
            const { jsPDF } = window.jspdf;
            const targetPdf = new jsPDF(chosenOrientation, 'mm', 'a4');
            const pageW = targetPdf.internal.pageSize.getWidth();
            const pageH = targetPdf.internal.pageSize.getHeight();

            const cols = parseInt(colsSelect.value, 10);
            const rows = parseInt(rowsSelect.value, 10);
            const slidesPerPage = cols * rows;

            const marginX = 8, marginY = 8, gap = 3;
            const slotW = (pageW - (2 * marginX) - ((cols - 1) * gap)) / cols;
            const slotH = (pageH - (2 * marginY) - ((rows - 1) * gap)) / rows;

            let currentSlotIndex = 0;
            let totalProcessed = 0;

            for (let i = 0; i < finalExecutionPipeline.length; i++) {
                statusBox.innerText = `Processing page ${i + 1}/${finalExecutionPipeline.length}...`;
                const node = finalExecutionPipeline[i];
                const viewport = node.pageRef.getViewport({ scale: 2.0 }); 
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                await node.pageRef.render({ canvasContext: ctx, viewport: viewport }).promise;

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                let shouldInvert = false;
                if (chosenInvert === 'always' || chosenInvert === 'auto') {
                    if (chosenInvert === 'always') {
                        shouldInvert = true;
                    } else {
                        let totalLuminance = 0;
                        let samples = 0;
                        for (let px = 0; px < data.length; px += 80) {
                            totalLuminance += (0.299 * data[px] + 0.587 * data[px + 1] + 0.114 * data[px + 2]);
                            samples++;
                        }
                        shouldInvert = (totalLuminance / samples) < 128;
                    }
                }

                // STANDARD CLEAN INVERSION
                for (let j = 0; j < data.length; j += 4) {
                    let r = data[j];
                    let g = data[j + 1];
                    let b = data[j + 2];

                    if (shouldInvert) {
                        r = 255 - r;
                        g = 255 - g;
                        b = 255 - b;
                    }

                    if (chosenMode === 'bw') {
                        let gray = Math.floor(0.299 * r + 0.587 * g + 0.114 * b);
                        data[j] = data[j + 1] = data[j + 2] = gray;
                    } else {
                        data[j] = r;
                        data[j + 1] = g;
                        data[j + 2] = b;
                    }
                }
                ctx.putImageData(imgData, 0, 0);

                if (totalProcessed > 0 && currentSlotIndex === 0) targetPdf.addPage();

                const cIdx = currentSlotIndex % cols;
                const rIdx = Math.floor(currentSlotIndex / cols);
                const dx = marginX + (cIdx * (slotW + gap));
                const dy = marginY + (rIdx * (slotH + gap));

                const aspect = viewport.width / viewport.height;
                let dw = slotW, dh = slotW / aspect;
                if (dh > slotH) { dh = slotH; dw = slotH * aspect; }

                const fx = dx + (slotW - dw) / 2;
                const fy = dy + (slotH - dh) / 2;

                targetPdf.addImage(canvas.toDataURL('image/jpeg', 0.85), 'JPEG', fx, fy, dw, dh);
                currentSlotIndex = (currentSlotIndex + 1) % slidesPerPage;
                totalProcessed++;
            }

            statusBox.innerText = "Compiling PDF document...";
            targetPdf.save('canvas-studio-notes-output.pdf');
            
            const durationSeconds = ((performance.now() - startTime) / 1000).toFixed(2);
            statusBox.innerText = `Compiled successfully in ${durationSeconds}s!`;
            
        } catch (err) {
            console.error(err);
            statusBox.innerText = "Error encountered during document compilation.";
        } finally {
            processBtn.disabled = false;
        }
    });
</script>
</body>
</html>
